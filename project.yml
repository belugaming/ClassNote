name: ClassNote
options:
  bundleIdPrefix: com.beluga.classnote
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    DEAD_CODE_STRIPPING: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    from: 1.5.0

targets:
  ClassNote:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info-iOS.plist"
          - "ClassNote-iOS.entitlements"
      - path: Features
      - path: Core
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ClassNote
        CFBundleShortVersionString: "0.3.0"
        CFBundleIconName: AppIcon
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDevelopmentRegion: en
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 ClassNote"
        NSMicrophoneUsageDescription: "ClassNote 需要麦克风权限以录制现场课程音频"
        NSSpeechRecognitionUsageDescription: "ClassNote 需要语音识别权限以使用 macOS 系统自带的本地语音转写"
        NSLocalNetworkUsageDescription: "ClassNote 需要本地网络权限以连接局域网内的本地 AI 服务"
        NSScreenCaptureUsageDescription: "ClassNote 需要屏幕录制权限以捕获 Zoom/Teams 等会议系统音频,仅使用音频流"
        NSAppleEventsUsageDescription: "ClassNote 需要辅助功能以支持全局快捷键(可选)"
        LSApplicationCategoryType: public.app-category.education
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSUIElement: false
    entitlements:
      path: App/ClassNote.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.speech-recognition: true
    dependencies:
      - package: GRDB
      - package: KeyboardShortcuts
      - package: LaTeXSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beluga.classnote
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClassNote_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "ClassNote.entitlements"
      - path: Features
        excludes:
          - "MenuBar/**"
          - "LiveSession/OverlayView.swift"
      - path: Core
        excludes:
          - "Hotkeys/**"
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: ClassNote
        CFBundleShortVersionString: "0.3.0"
        CFBundleIconName: AppIcon
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleDevelopmentRegion: en
        NSHumanReadableCopyright: "© 2026 ClassNote"
        NSMicrophoneUsageDescription: "ClassNote 需要麦克风权限以录制现场课程音频"
        NSSpeechRecognitionUsageDescription: "ClassNote 需要语音识别权限以使用系统自带的本地语音转写"
        NSLocalNetworkUsageDescription: "ClassNote 需要本地网络权限以连接局域网内的本地 AI 服务"
        LSApplicationCategoryType: public.app-category.education
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/ClassNote-iOS.entitlements
      properties: {}
    dependencies:
      - package: GRDB
      - package: LaTeXSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beluga.classnote
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  ClassNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClassNoteTests
    dependencies:
      - target: ClassNote
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClassNote.app/Contents/MacOS/ClassNote"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.beluga.classnote.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

schemes:
  ClassNote:
    build:
      targets:
        ClassNote: all
        ClassNoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClassNoteTests
    archive:
      config: Release
