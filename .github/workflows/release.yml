name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Seconds, not the ten minutes of a build: a tag that disagrees with
  # project.yml fails here before anything is compiled.
  version:
    name: Tag matches MARKETING_VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the version (tag, or MARKETING_VERSION for a manual run)
        id: resolve
        run: |
          set -euo pipefail
          APP_VERSION="$(grep -E '^\s*MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
              echo "::error::tag v$TAG_VERSION does not match MARKETING_VERSION $APP_VERSION in project.yml. Bump MARKETING_VERSION (and CURRENT_PROJECT_VERSION) on main first, then tag that commit."
              exit 1
            fi
            VERSION="$TAG_VERSION"
          else
            # workflow_dispatch on a branch: build the DMGs as artifacts only.
            VERSION="$APP_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Tests must pass before a release is cut
    uses: ./.github/workflows/ci.yml

  # Apple Silicon only: the app needs macOS 26 and the local engines need
  # Apple Silicon, so an Intel build would be a download nobody can use well.
  #
  # Built with Xcode 27 on macOS 27, so the app is linked against the macOS 27
  # SDK and gets that system's behavior rather than a compatibility mode.
  build:
    name: Build DMG (${{ matrix.arch }})
    needs: [version, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: xcode-27
            xcode: "27"
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          # The newest release of this Xcode, not a beta. A version-named path
          # can be a link to a beta (Xcode_27.2.app -> Xcode_27.2_beta.app),
          # so judge each by where it really points.
          XCODE="$(for app in /Applications/Xcode_${{ matrix.xcode }}*.app; do realpath "$app"; done \
            | grep -viE 'beta|release_candidate|_rc' | sort -uV | tail -1)"
          if [ -z "$XCODE" ]; then
            echo "::error::no release of Xcode ${{ matrix.xcode }} on this runner"
            ls -l /Applications | grep Xcode
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ClassNote.xcodeproj \
            -scheme ClassNote

      # ARCHS pins the slice (project.yml does too), so the binary can never
      # come out universal.
      - name: Build Release (${{ matrix.arch }})
        run: |
          xcodebuild -project ClassNote.xcodeproj \
                     -scheme ClassNote \
                     -configuration Release \
                     -destination 'generic/platform=macOS' \
                     -derivedDataPath build/DerivedData \
                     -skipMacroValidation \
                     ARCHS=${{ matrix.arch }} \
                     ONLY_ACTIVE_ARCH=NO \
                     build

      - name: Check the binary is ${{ matrix.arch }} only
        run: |
          set -euo pipefail
          BINARY="build/DerivedData/Build/Products/Release/ClassNote.app/Contents/MacOS/ClassNote"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "ClassNote binary: $ARCHS"
          if [[ "$ARCHS" != "${{ matrix.arch }}" ]]; then
            echo "::error::expected only ${{ matrix.arch }}, got: $ARCHS"
            exit 1
          fi

      - name: Package DMG
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/ClassNote.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "✗ ClassNote.app not found at $APP_PATH"
            exit 1
          fi

          STAGE_DIR="build/dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/"
          ln -s /Applications "$STAGE_DIR/Applications"

          DMG_NAME="ClassNote-${VERSION}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "ClassNote" \
                          -srcfolder "$STAGE_DIR" \
                          -ov -format UDZO \
                          "$DMG_NAME"

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassNote-dmg-${{ matrix.arch }}
          path: ${{ env.DMG_NAME }}

  # Its own job, after the build, so a release is only created once there is
  # a DMG to attach.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: ClassNote-dmg-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClassNote-*.dmg
          generate_release_notes: true
