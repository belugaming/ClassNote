name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build + tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15, Xcode 26.2
            slug: macos15
            runner: macos-15
            xcode: "26.2"
          # The OS most users are on: build with its SDK and run the tests on
          # it. GitHub names this image after its Xcode; it runs macOS 27.
          - name: macOS 27, Xcode 27
            slug: macos27
            runner: xcode-27
            xcode: "27"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          # The newest release of this Xcode, not a beta.
          XCODE="$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ matrix.slug }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ matrix.slug }}-

      - name: Resolve Swift package dependencies
        run: |
          mkdir -p build
          xcodebuild -resolvePackageDependencies \
            -project ClassNote.xcodeproj \
            -scheme ClassNote \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build (Debug, with tests)
        run: |
          mkdir -p build
          set +e
          xcodebuild -project ClassNote.xcodeproj \
                     -scheme ClassNote \
                     -configuration Debug \
                     -destination 'platform=macOS,arch=arm64' \
                     -derivedDataPath build/DerivedData \
                     -clonedSourcePackagesDirPath build/SourcePackages \
                     -skipMacroValidation \
                     build-for-testing 2>&1 \
            | tee build/xcodebuild-build.log \
            | grep -E "^/.*:[0-9]+:[0-9]+: (error|warning):|^(ld|clang): error:|^\*\* "
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Compiler errors"
            grep -nE "^/.*:[0-9]+:[0-9]+: (error|fatal error):|^(ld|clang): error:|error: " \
              build/xcodebuild-build.log | sort -u | head -200
            echo "::endgroup::"
          fi
          # Warning count is informational; strict-concurrency work tracks it.
          echo "warnings: $(grep -cE '^/.*:[0-9]+:[0-9]+: warning:' build/xcodebuild-build.log || true)"
          exit $status

      # MarkdownView builds its LaTeX support, and links SwiftMath, only when
      # its `LaTeX` trait is on. Without it the app still builds and every
      # formula shows up as raw `$$…$$` source, so check for both here.
      - name: Check LaTeX rendering is compiled in
        run: |
          status=0
          if ! grep -q 'ENABLE_MATH_RENDERING' build/xcodebuild-build.log; then
            echo "::error::MarkdownView was built without ENABLE_MATH_RENDERING, so formulas would show as raw LaTeX"
            status=1
          fi
          if ! ls build/DerivedData/Build/Products/Debug/ClassNote.app/Contents/Resources | grep -q SwiftMath; then
            echo "::error::SwiftMath's resources are missing from ClassNote.app"
            status=1
          fi
          exit $status

      - name: Run unit + integration tests
        run: |
          set +e
          xcodebuild -project ClassNote.xcodeproj \
                     -scheme ClassNote \
                     -configuration Debug \
                     -destination 'platform=macOS,arch=arm64' \
                     -derivedDataPath build/DerivedData \
                     -clonedSourcePackagesDirPath build/SourcePackages \
                     -skipMacroValidation \
                     -resultBundlePath build/TestResults.xcresult \
                     test-without-building 2>&1 \
            | tee build/xcodebuild-test.log \
            | grep -E "Test Case .* (passed|failed)|Test Suite .* (passed|failed)|error:|^\*\* "
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Failures"
            grep -nE "error:|failed" build/xcodebuild-test.log | head -200
            echo "::endgroup::"
            exit $status
          fi
          # The exit status is authoritative; this only guards against a run where
          # the bundle failed to load and zero tests executed.
          executed=$(grep -cE "^Test Case .* passed" build/xcodebuild-test.log || true)
          echo "tests passed: $executed"
          [ "$executed" -gt 0 ]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs-${{ matrix.slug }}
          path: |
            build/xcodebuild-build.log
            build/xcodebuild-test.log
          if-no-files-found: ignore

      # ~90 MB per run, so only when there is something to diagnose.
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.slug }}
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  python:
    name: Python sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies (the pinned set, minus the Apple-only wheels)
        run: |
          grep -vE '^(mlx|sherpa-onnx|transformers)' Scripts/requirements-local.txt > /tmp/requirements-ci.txt
          python -m pip install --quiet -r /tmp/requirements-ci.txt pyflakes

      - name: Syntax check sidecars
        run: |
          python -m py_compile Scripts/*.py
          python -m pyflakes Scripts/*.py Tests/PythonTests/*.py

      - name: Run tests
        run: python -m unittest discover -s Tests/PythonTests -v

      - name: Report HuggingFace model revisions (informational)
        continue-on-error: true
        run: |
          python -m pip install --quiet huggingface_hub
          python - <<'EOF'
          from huggingface_hub import HfApi
          api = HfApi()
          repos = [f"csukuangfj2/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-{c}ms-int8-2026-06-11"
                   for c in (80, 160, 320, 560, 1120)]
          repos += ["csukuangfj/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12",
                    "mlx-community/Hy-MT2-1.8B-4bit",
                    "mlx-community/Confucius4-R2T2-8bit",
                    "mlx-community/Confucius4-R2T2-bf16",
                    "netease-youdao/Confucius4-R2T2",
                    "netease-youdao/Confucius4-T3PO",
                    "mlx-community/Qwen3-4B-Instruct-2507-4bit",
                    "mlx-community/Qwen3-8B-4bit"]
          for r in repos:
              try:
                  info = api.model_info(r)
                  print(f"{r} sha={info.sha} files={[s.rfilename for s in info.siblings][:10]}")
              except Exception as e:
                  print(f"{r} ERROR {type(e).__name__}: {e}")
          EOF
